<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Silver Multiverse Central Radial Luminous Glow -->
    <radialGradient id="silverMultiverseCore" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.28" />
      <stop offset="25%" stop-color="#CBD5E1" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#334155" stop-opacity="0.22" />
      <stop offset="85%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Outer Perimeter Charcoal Vignette -->
    <linearGradient id="charcoalPerimeter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070A10" stop-opacity="0.9" />
      <stop offset="20%" stop-color="transparent" />
      <stop offset="80%" stop-color="transparent" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0.95" />
    </linearGradient>

    <!-- Horizontal Brushed Steel Sheen -->
    <linearGradient id="brushedSteelSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#475569" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#F1F5F9" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#475569" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Fine Futuristic Hairline Grid Pattern -->
    <pattern id="futuristicGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#94A3B8" stroke-width="0.65" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#CBD5E1" fill-opacity="0.25" />
      <circle cx="60" cy="0" r="1" fill="#CBD5E1" fill-opacity="0.25" />
    </pattern>

    <!-- Restrained Crimson Streak Gradient -->
    <linearGradient id="crimsonStreak1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0" />
      <stop offset="40%" stop-color="#EF4444" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#F87171" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="crimsonStreak2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Silver Light Flares -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian/Charcoal Base Background -->
  <rect width="1920" height="1080" fill="#090D15" />

  <!-- Brushed Steel Horizontal Band Across Horizon -->
  <rect y="220" width="1920" height="640" fill="url(#brushedSteelSheen)" />

  <!-- Luminous Central Silver-Grey Radial Field -->
  <rect width="1920" height="1080" fill="url(#silverMultiverseCore)" />

  <!-- Fine Futuristic Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#futuristicGrid)" />

  <!-- ========================================================================= -->
  <!-- CONCENTRIC MULTIVERSE ORBITAL TELEMETRY RINGS (Subtle, elegant)           -->
  <!-- ========================================================================= -->
  <g transform="translate(960, 460)" opacity="0.35">
    <!-- Outer Quantum Ring -->
    <circle r="520" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="8 16" />
    <circle r="460" fill="none" stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="3 9" />
    <circle r="380" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="140 180" />
    <!-- Fine Segmented Compass Marks -->
    <line x1="-540" y1="0" x2="-510" y2="0" stroke="#EF4444" stroke-width="2" />
    <line x1="510" y1="0" x2="540" y2="0" stroke="#EF4444" stroke-width="2" />
    <line x1="0" y1="-480" x2="0" y2="-450" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="0" y1="450" x2="0" y2="480" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Crosshair Coordinates -->
    <path d="M -20 0 L 20 0 M 0 -20 L 0 20" stroke="#94A3B8" stroke-width="0.75" opacity="0.4" />
  </g>

  <!-- ========================================================================= -->
  <!-- FAINT, LOW-OPACITY CHARACTER SILHOUETTES AT FAR PERIPHERY (Clean Center)  -->
  <!-- Opacity kept at ~0.08 to 0.12 so they never crowd or distract               -->
  <!-- ========================================================================= -->

  <!-- Far Left Peripheral Silhouettes: Armored Hero Stance (Iron Man / Thor) -->
  <g transform="translate(180, 560)" opacity="0.11" fill="#64748B">
    <!-- Floating Armored Stance Outline -->
    <path d="M 0 -160 L 20 -150 L 35 -100 L 50 -30 L 30 180 L -30 180 L -50 -30 L -35 -100 L -20 -150 Z" />
    <!-- Arc Chest Core Subtle Glimmer -->
    <circle cx="0" cy="-60" r="8" fill="#E2E8F0" opacity="0.4" />
    <!-- Shoulder Armor Blades -->
    <polygon points="-35,-120 -80,-90 -45,-70" />
    <polygon points="35,-120 80,-90 45,-70" />
    <!-- Cape Silhouette Stream -->
    <path d="M -45 -80 L -120 180 L -40 180 Z" opacity="0.6" />
  </g>

  <!-- Far Right Peripheral Silhouettes: Agile Shield Silhouette (Cap / Panther) -->
  <g transform="translate(1740, 560)" opacity="0.10" fill="#64748B">
    <!-- Athletic Hero Stance Outline -->
    <path d="M 0 -150 L 18 -135 L 28 -80 L 40 -10 L 24 180 L -24 180 L -40 -10 L -28 -80 L -18 -135 Z" />
    <!-- Shield Circular Silhouette -->
    <circle cx="-50" cy="-40" r="48" fill="none" stroke="#E2E8F0" stroke-width="6" opacity="0.4" />
    <circle cx="-50" cy="-40" r="28" fill="none" stroke="#DC2626" stroke-width="4" opacity="0.5" />
    <polygon points="-50,-52 -46,-42 -36,-42 -44,-36 -41,-26 -50,-32 -59,-26 -56,-36 -64,-42 -54,-42" fill="#E2E8F0" opacity="0.4" />
  </g>

  <!-- ========================================================================= -->
  <!-- RESTRAINED, CRISP CRIMSON ENERGY STREAKS                                   -->
  <!-- ========================================================================= -->
  <!-- Horizontal Horizon Accent Line -->
  <line x1="300" y1="580" x2="1620" y2="580" stroke="url(#crimsonStreak1)" stroke-width="1.8" filter="url(#softGlow)" />
  <line x1="500" y1="580" x2="1420" y2="580" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />

  <!-- Diagonal Restrained Tech Slashes -->
  <line x1="220" y1="360" x2="480" y2="280" stroke="url(#crimsonStreak2)" stroke-width="1.5" opacity="0.75" />
  <line x1="1440" y1="640" x2="1700" y2="560" stroke="url(#crimsonStreak2)" stroke-width="1.5" opacity="0.75" />

  <!-- Precision Corner Telemetry Accents -->
  <g stroke="#94A3B8" stroke-width="1" opacity="0.3" fill="none">
    <!-- Top Left Corner Bracket -->
    <path d="M 60 100 L 60 60 L 100 60" />
    <!-- Top Right Corner Bracket -->
    <path d="M 1820 60 L 1860 60 L 1860 100" />
    <!-- Bottom Left Corner Bracket -->
    <path d="M 60 980 L 60 1020 L 100 1020" />
    <!-- Bottom Right Corner Bracket -->
    <path d="M 1820 1020 L 1860 1020 L 1860 980" />
  </g>

  <!-- Subtle Atmospheric Silver Light Sheen in Center -->
  <ellipse cx="960" cy="460" rx="380" ry="160" fill="#FFFFFF" fill-opacity="0.04" filter="url(#softGlow)" />

  <!-- Outer Perimeter Charcoal/Obsidian Darkening Gradient -->
  <rect width="1920" height="1080" fill="url(#charcoalPerimeter)" />
</svg>
