<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Cosmic Obsidian & Crimson Atmospheric Gradients -->
    <radialGradient id="nebulaCore" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#1E070B" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#080305" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030103" />
    </radialGradient>
    <radialGradient id="arcCyanGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="starkRedGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.3" />
      <stop offset="70%" stop-color="transparent" />
    </radialGradient>
    <radialGradient id="cosmicGoldGlow" cx="80%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.25" />
      <stop offset="70%" stop-color="transparent" />
    </radialGradient>
    <!-- Tech Grid Pattern -->
    <pattern id="starkHex" width="60" height="60" patternUnits="userSpaceOnUse" opacity="0.08">
      <path d="M 30 0 L 60 17.3 L 60 52 L 30 69.3 L 0 52 L 0 17.3 Z" fill="none" stroke="#E2E8F0" stroke-width="1" />
    </pattern>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="30%" stop-color="#DC2626" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#050204" />
  <rect width="1920" height="1080" fill="url(#nebulaCore)" />
  <rect width="1920" height="1080" fill="url(#starkRedGlow)" />
  <rect width="1920" height="1080" fill="url(#cosmicGoldGlow)" />
  <rect width="1920" height="1080" fill="url(#arcCyanGlow)" />
  <rect width="1920" height="1080" fill="url(#starkHex)" />

  <!-- Stark Tech Geometric Telemetry Rings in Center Background -->
  <g transform="translate(960, 480)" opacity="0.3">
    <circle r="420" fill="none" stroke="#E23636" stroke-width="1.5" stroke-dasharray="25 40" />
    <circle r="360" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8 12" />
    <circle r="300" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="120 180" />
    <circle r="220" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Horizon Light Ray -->
  <rect x="0" y="620" width="1920" height="2" fill="url(#horizonGlow)" opacity="0.7" />

  <!-- Epic Hero Silhouettes Assembled on Cinematic Horizon -->
  <g transform="translate(960, 780)" fill="#070205" stroke="#1F080F" stroke-width="2">
    <!-- Center: Captain America Stance -->
    <path d="M -30 0 L -25 -110 C -25 -125 -15 -135 0 -135 C 15 -135 25 -125 25 -110 L 30 0 Z" />
    <!-- Cap Shield Outline on Arm -->
    <ellipse cx="-45" cy="-60" rx="30" ry="40" fill="#0C0407" stroke="#DC2626" stroke-width="1.5" opacity="0.8" />
    
    <!-- Left: Iron Man Floating Stance -->
    <g transform="translate(-140, -40)">
      <path d="M -25 0 L -20 -95 C -20 -115 -10 -125 0 -125 C 10 -125 20 -115 20 -95 L 25 0 Z" />
      <!-- Glowing Arc Reactor & Repulsor Glow -->
      <circle cx="0" cy="-75" r="5" fill="#38BDF8" filter="drop-shadow(0 0 8px #38BDF8)" />
      <circle cx="-35" cy="-30" r="4" fill="#38BDF8" filter="drop-shadow(0 0 6px #38BDF8)" />
      <circle cx="35" cy="-30" r="4" fill="#38BDF8" filter="drop-shadow(0 0 6px #38BDF8)" />
    </g>

    <!-- Far Left: Thor with Hammer -->
    <g transform="translate(-280, -10)">
      <path d="M -28 0 L -22 -115 C -22 -130 -10 -140 0 -140 C 10 -140 22 -130 22 -115 L 28 0 Z" />
      <!-- Cape Silhouette -->
      <path d="M -45 -100 L -70 0 L -30 0 Z" fill="#180408" />
      <!-- Lightning Arc -->
      <path d="M 50 -160 L 40 -120 L 55 -100 L 45 -60" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7" />
    </g>

    <!-- Right: Black Panther Agile Crouch -->
    <g transform="translate(140, -15)">
      <path d="M -22 0 L -18 -95 C -18 -110 -8 -120 0 -120 C 8 -120 18 -110 18 -95 L 22 0 Z" />
      <!-- Violet Kinetic Eyes -->
      <circle cx="-5" cy="-105" r="2" fill="#C084FC" filter="drop-shadow(0 0 4px #C084FC)" />
      <circle cx="5" cy="-105" r="2" fill="#C084FC" filter="drop-shadow(0 0 4px #C084FC)" />
    </g>

    <!-- Far Right: Doctor Strange Levitation & Sling Ring Spurt -->
    <g transform="translate(280, -35)">
      <path d="M -25 0 L -20 -105 C -20 -120 -10 -130 0 -130 C 10 -130 20 -120 20 -105 L 25 0 Z" />
      <!-- High Cloak of Levitation Collar -->
      <polygon points="-28,-115 -42,-145 -15,-125" fill="#180408" stroke="#DC2626" stroke-width="1" />
      <polygon points="28,-115 42,-145 15,-125" fill="#180408" stroke="#DC2626" stroke-width="1" />
      <!-- Small Golden Spark Ring on Hand -->
      <circle cx="-38" cy="-55" r="14" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" filter="drop-shadow(0 0 6px #F59E0B)" />
    </g>
  </g>

  <!-- Ground Shadow & Fade to pure dark base -->
  <rect x="0" y="780" width="1920" height="300" fill="url(#nebulaCore)" opacity="0.95" />
</svg>
