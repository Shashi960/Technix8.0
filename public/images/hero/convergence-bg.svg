<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="splitGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050B1A" />
      <stop offset="42%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#080712" />
      <stop offset="58%" stop-color="#190729" />
      <stop offset="100%" stop-color="#14041F" />
    </linearGradient>

    <!-- Center Convergence Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#2D0B4E" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#0E1235" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#04060C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#04060C" stop-opacity="0.98" />
    </radialGradient>

    <!-- Left: Stadium Floodlight Beam Gradient -->
    <radialGradient id="floodlightBeam" cx="8%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="80%" stop-color="transparent" />
    </radialGradient>

    <!-- Orange Graffiti Burst Gradient -->
    <radialGradient id="orangeBurst" cx="24%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#D9480F" stop-opacity="0.2" />
      <stop offset="80%" stop-color="transparent" />
    </radialGradient>

    <!-- Right: Cultural Purple / Orchid Glow -->
    <radialGradient id="culturalGlow" cx="82%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#6B21A8" stop-opacity="0.2" />
      <stop offset="85%" stop-color="transparent" />
    </radialGradient>

    <!-- Left: Chainlink Mesh Pattern -->
    <pattern id="chainlink" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 0 14 L 14 0 L 28 14 L 14 28 Z" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.25" />
      <path d="M 14 0 L 28 14 L 14 28 L 0 14 Z" fill="none" stroke="#E2E8F0" stroke-width="0.4" stroke-opacity="0.15" />
    </pattern>

    <!-- Left: Checkered Flag Accent Pattern -->
    <pattern id="checkerPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FF8800" fill-opacity="0.45" />
      <rect x="10" y="10" width="10" height="10" fill="#FF8800" fill-opacity="0.45" />
    </pattern>

    <!-- Right: Islamic / Mughal Palace Lattice Jali Pattern -->
    <pattern id="jaliPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="14" fill="none" stroke="#E879F9" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#E879F9" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="36" cy="0" r="14" fill="none" stroke="#E879F9" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="0" cy="36" r="14" fill="none" stroke="#E879F9" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="36" cy="36" r="14" fill="none" stroke="#E879F9" stroke-width="0.8" stroke-opacity="0.25" />
      <polygon points="18,6 30,18 18,30 6,18" fill="none" stroke="#FDE047" stroke-width="0.6" stroke-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Base Split Gradient Background -->
  <rect width="1920" height="1080" fill="url(#splitGradient)" />

  <!-- ========================================================================= -->
  <!-- LEFT SIDE: SPORTS, TECH, STADIUM & STREET GRAFFITI AESTHETIC               -->
  <!-- ========================================================================= -->

  <!-- Left Atmosphere Glows -->
  <rect x="0" y="0" width="960" height="1080" fill="url(#floodlightBeam)" />
  <rect x="0" y="0" width="960" height="1080" fill="url(#orangeBurst)" />

  <!-- Stadium Floodlight Tower Silhouettes in Top Left -->
  <g transform="translate(140, 40)" opacity="0.65">
    <!-- Floodlight Mast Rig -->
    <polygon points="-15,0 15,0 8,190 -8,190" fill="#0A1835" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#38BDF8" stroke-width="2" />
    <line x1="-40" y1="60" x2="40" y2="60" stroke="#38BDF8" stroke-width="2" />
    <line x1="-50" y1="90" x2="50" y2="90" stroke="#38BDF8" stroke-width="2" />
    <!-- Bright Floodlight Bulb Beams -->
    <circle cx="-35" cy="25" r="7" fill="#E0F2FE" filter="drop-shadow(0 0 10px #38BDF8)" />
    <circle cx="-15" cy="25" r="7" fill="#E0F2FE" filter="drop-shadow(0 0 10px #38BDF8)" />
    <circle cx="5" cy="25" r="7" fill="#E0F2FE" filter="drop-shadow(0 0 10px #38BDF8)" />
    <circle cx="25" cy="25" r="7" fill="#E0F2FE" filter="drop-shadow(0 0 10px #38BDF8)" />
  </g>

  <!-- Wire Netting / Chainlink Mesh Panels on Far Left -->
  <g transform="rotate(-8 300 600)">
    <rect x="-100" y="320" width="460" height="600" fill="url(#chainlink)" opacity="0.45" />
    <!-- Angular Chainlink Fence Posts -->
    <line x1="80" y1="280" x2="80" y2="950" stroke="#1E293B" stroke-width="8" />
    <line x1="280" y1="280" x2="280" y2="950" stroke="#1E293B" stroke-width="8" />
    <line x1="80" y1="340" x2="280" y2="320" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5" />
    <line x1="80" y1="640" x2="280" y2="620" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Sports Pitch / Arena Boundary Markings (Court Center Circle & Pen Area) -->
  <g transform="translate(260, 520) rotate(-15)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="140" ry="85" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="16 8" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Vibrant Orange & Cyan Graffiti Shards & Street Hazard Accents -->
  <g transform="translate(360, 420)">
    <!-- Checkered Racing Pattern Patch -->
    <polygon points="0,0 120,-30 160,80 40,110" fill="url(#checkerPattern)" opacity="0.75" />
    <!-- Sharp Electric Orange Wedge Blades -->
    <polygon points="-80,80 180,-60 220,-40 -40,120" fill="#FF5E00" opacity="0.7" />
    <polygon points="120,40 280,0 260,30 100,70" fill="#FF9900" opacity="0.65" />
    <polygon points="-120,160 80,100 60,130 -140,190" fill="#FF3300" opacity="0.5" />
    <!-- Electric Blue Spray Spatter -->
    <polygon points="60,-120 180,-80 140,-50" fill="#00D4FF" opacity="0.6" />
    <polygon points="200,90 290,140 260,160" fill="#0284C7" opacity="0.7" />
  </g>

  <!-- Bold Angled Lightning Bolts (Tech / Athletic Energy) -->
  <g stroke="#FFB703" stroke-width="4" fill="none" opacity="0.85">
    <polyline points="280,380 320,440 300,450 350,530" />
    <polyline points="450,260 480,310 465,320 500,380" stroke="#00F0FF" stroke-width="3" />
  </g>


  <!-- ========================================================================= -->
  <!-- RIGHT SIDE: CULTURAL PALACE, ARCHWAYS, JALI, KITES & FLORALS              -->
  <!-- ========================================================================= -->

  <!-- Right Atmosphere Cultural Glow -->
  <rect x="960" y="0" width="960" height="1080" fill="url(#culturalGlow)" />

  <!-- Royal Mughal / Moroccan Palace Silhouettes with Glowing Domes & Minarets -->
  <g transform="translate(1550, 680)">
    <!-- Palace Base Terraces -->
    <rect x="-350" y="80" width="750" height="350" fill="#0B0314" stroke="#581C87" stroke-width="2" />
    
    <!-- Central Grand Onion Dome -->
    <path
      d="M -160,80 
         C -160,-20 -100,-90 0,-140 
         C 100,-90 160,-20 160,80 Z"
      fill="#140624"
      stroke="#A855F7"
      stroke-width="2.5"
    />
    <!-- Dome Golden Finial Spire -->
    <line x1="0" y1="-140" x2="0" y2="-210" stroke="#FDE047" stroke-width="4" />
    <circle cx="0" cy="-210" r="7" fill="#FDE047" filter="drop-shadow(0 0 10px #FACC15)" />
    <circle cx="0" cy="-175" r="10" fill="none" stroke="#FDE047" stroke-width="2" />

    <!-- Left Minaret Tower -->
    <g transform="translate(-280, 0)">
      <rect x="-24" y="-120" width="48" height="200" fill="#11051F" stroke="#9333EA" stroke-width="1.5" />
      <!-- Minaret Domelet & Balcony -->
      <polygon points="-32,-120 32,-120 20,-135 -20,-135" fill="#3B0764" stroke="#C084FC" stroke-width="1.5" />
      <path d="M -16,-135 C -16,-170 0,-195 0,-195 C 0,-195 16,-170 16,-135 Z" fill="#2E1065" stroke="#C084FC" stroke-width="1.5" />
      <line x1="0" y1="-195" x2="0" y2="-230" stroke="#FDE047" stroke-width="2.5" />
    </g>

    <!-- Right Minaret Tower -->
    <g transform="translate(280, 0)">
      <rect x="-24" y="-120" width="48" height="200" fill="#11051F" stroke="#9333EA" stroke-width="1.5" />
      <polygon points="-32,-120 32,-120 20,-135 -20,-135" fill="#3B0764" stroke="#C084FC" stroke-width="1.5" />
      <path d="M -16,-135 C -16,-170 0,-195 0,-195 C 0,-195 16,-170 16,-135 Z" fill="#2E1065" stroke="#C084FC" stroke-width="1.5" />
      <line x1="0" y1="-195" x2="0" y2="-230" stroke="#FDE047" stroke-width="2.5" />
    </g>

    <!-- Illuminated Palace Cusped Archways -->
    <g transform="translate(0, 100)">
      <!-- Central Arch Opening (Warm Lantern Glow Inside) -->
      <path
        d="M -70,220 L -70,80 C -70,20 -40,0 0,-25 C 40,0 70,20 70,80 L 70,220 Z"
        fill="#FFE8B0"
        fill-opacity="0.12"
        stroke="#FDE047"
        stroke-width="2"
      />
      <!-- Left Arch -->
      <path
        d="M -190,220 L -190,100 C -190,50 -165,30 -140,10 C -115,30 -90,50 -90,100 L -90,220 Z"
        fill="#FFE8B0"
        fill-opacity="0.08"
        stroke="#E879F9"
        stroke-width="1.5"
      />
      <!-- Right Arch -->
      <path
        d="M 90,220 L 90,100 C 90,50 115,30 140,10 C 165,30 190,50 190,100 L 190,220 Z"
        fill="#FFE8B0"
        fill-opacity="0.08"
        stroke="#E879F9"
        stroke-width="1.5"
      />
    </g>
  </g>

  <!-- Ornate Decorative Laser-Cut Jali Trellis Arch at Top Right -->
  <g transform="translate(1420, 0)">
    <!-- Giant Cusped Mughal Arch Frame -->
    <path
      d="M 0,0 L 500,0 L 500,480 
         C 460,450 420,400 400,320 
         C 370,360 320,380 270,360 
         C 230,410 180,410 130,370 
         C 80,420 30,390 0,330 Z"
      fill="url(#jaliPattern)"
      stroke="#A855F7"
      stroke-width="3"
      opacity="0.55"
    />
  </g>

  <!-- Festive Traditional Kites (Patang) Soaring in Sky -->
  <!-- Kite 1: Golden Yellow Diamond Kite -->
  <g transform="translate(1380, 680) rotate(22)">
    <polygon points="0,-40 38,0 0,40 -38,0" fill="#FACC15" stroke="#EAB308" stroke-width="2" opacity="0.85" />
    <polygon points="0,40 -16,65 16,65" fill="#E11D48" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#713F12" stroke-width="1.5" />
    <path d="M -38,0 C 0,-15 0,-15 38,0" stroke="#713F12" stroke-width="1.5" fill="none" />
    <!-- Thread Line -->
    <path d="M 0,55 C 20,95 40,150 80,220" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" fill="none" />
  </g>

  <!-- Kite 2: Cyan & Purple Accent Kite -->
  <g transform="translate(1720, 360) rotate(-18)">
    <polygon points="0,-32 30,0 0,32 -30,0" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5" opacity="0.8" />
    <polygon points="0,32 -12,52 12,52" fill="#A855F7" />
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#0F172A" stroke-width="1.2" />
  </g>

  <!-- Cascading Royal Purple, Orchid & Magenta Botanicals & Petals -->
  <g fill="#E879F9" opacity="0.75" filter="drop-shadow(0 0 6px #C084FC)">
    <!-- Swirling Vine & Petal 1 -->
    <path d="M 1180,200 C 1220,180 1260,220 1240,250 C 1210,240 1190,210 1180,200 Z" fill="#D946EF" />
    <!-- Petal 2 -->
    <path d="M 1290,280 C 1315,260 1340,285 1330,305 C 1310,300 1295,285 1290,280 Z" fill="#A855F7" />
    <!-- Petal 3 -->
    <path d="M 1380,240 C 1410,220 1435,250 1420,270 C 1400,265 1385,250 1380,240 Z" fill="#EC4899" />
    <!-- Petal 4 -->
    <path d="M 1120,620 C 1145,595 1175,620 1160,640 C 1140,635 1125,625 1120,620 Z" fill="#F43F5E" />
    <!-- Floating Leaves -->
    <path d="M 1480,480 C 1510,470 1520,500 1500,515 C 1485,505 1475,490 1480,480 Z" fill="#818CF8" />
  </g>


  <!-- ========================================================================= -->
  <!-- CENTER CONVERGENCE: SEAM, SHADOW VIGNETTE & CELESTIAL STAR SPARKLE        -->
  <!-- ========================================================================= -->

  <!-- Deep Cosmic Convergence Overlay in Center -->
  <rect width="1920" height="1080" fill="url(#centerGlow)" />

  <!-- Top Center Celestial Diamond Star Sparkle (Image 1 Focal Point) -->
  <g transform="translate(960, 310)">
    <!-- Radiant Star Halo -->
    <circle r="45" fill="#FFFFFF" fill-opacity="0.1" filter="blur(10px)" />
    <circle r="18" fill="#F0ABFC" fill-opacity="0.3" filter="blur(5px)" />
    <!-- 4-Point Sharp Diamond Glyph -->
    <polygon points="0,-36 6,-8 36,0 6,8 0,36 -6,8 -36,0 -6,-8" fill="#FFFFFF" filter="drop-shadow(0 0 12px #FFFFFF)" />
    <!-- Diagonal Subtle Cross -->
    <polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="#F472B6" />
    <!-- Horizontal & Vertical Lens Flare Rays -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65" />
  </g>

  <!-- Deep Bottom Darkening Vignette for Text & Button Legibility -->
  <rect x="0" y="700" width="1920" height="380" fill="url(#splitGradient)" opacity="0.9" />
  <rect x="0" y="850" width="1920" height="230" fill="#04060C" opacity="0.96" />
</svg>
